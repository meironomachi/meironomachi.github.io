<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 민주노총 직선 5기 선거</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-96.png?v=2" type="image/png" sizes="96x96">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<meta name="description" content="2026년 민주노총 직선 5기 임원 선거 후보조를 한눈에 보는 비공식 특별 페이지">
<script>
  // 저장된 화면 테마(meiro.kr 전체 공통)를 먼저 적용해서 깜빡이지 않게 함
  try { const t = localStorage.getItem("meiro-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* 2026 민주노총 직선 5기 선거 특별 페이지 (비공식). 후보조마다 정해진 포인트 색 */
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1b1c1f; --muted:#62656d; --line:#e2e0da; --soft:#efede8;
  --head-a:#16171b; --head-b:#2a2c33;
  /* 기호 1: 진한 빨강 + 흰색 */
  --c1:#b3121f; --c1-ink:#ffffff; --c1-soft:#fbe9ea;
  /* 기호 2: 주황 */
  --c2:#f26b1d; --c2-ink:#ffffff; --c2-soft:#fff0e6;
  /* 기호 3: 연회색(베이지 기운) + 버건디 */
  --c3:#e7e2d8; --c3-ink:#7d1a2c; --c3-soft:#f4f1ea; --c3-accent:#7d1a2c;
  /* 기호 4: 초록 */
  --c4:#1f8a4c; --c4-ink:#ffffff; --c4-soft:#e6f4ec;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --card:#1b1d22; --ink:#ecebe7; --muted:#a3a5ad; --line:#2d3038; --soft:#24262c;
    --head-a:#0b0c0e; --head-b:#1d1f25;
    --c1-soft:#3a1418; --c2-soft:#3d2414; --c3-soft:#2f2a24; --c4-soft:#14301f;
    --c3-accent:#e8a3b0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --card:#1b1d22; --ink:#ecebe7; --muted:#a3a5ad; --line:#2d3038; --soft:#24262c;
  --head-a:#0b0c0e; --head-b:#1d1f25;
  --c1-soft:#3a1418; --c2-soft:#3d2414; --c3-soft:#2f2a24; --c4-soft:#14301f;
  --c3-accent:#e8a3b0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.6;word-break:keep-all}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f26b1d;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}

/* 위쪽 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.bar a{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.06em;font-size:14px;opacity:.9}
.theme{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer}
.theme svg{width:16px;height:16px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}:root[data-theme="dark"] .theme .moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon{display:none}}
header.hero{background:linear-gradient(160deg,var(--head-a),var(--head-b));color:#fff;padding-bottom:40px;position:relative;overflow:hidden}
.hero .stripes{position:absolute;left:0;right:0;bottom:0;height:8px;display:grid;grid-template-columns:repeat(4,1fr)}
.hero .stripes span:nth-child(1){background:var(--c1)}.hero .stripes span:nth-child(2){background:var(--c2)}
.hero .stripes span:nth-child(3){background:var(--c3)}.hero .stripes span:nth-child(4){background:var(--c4)}
.hero .kicker{display:inline-block;margin-top:28px;font-size:13px;letter-spacing:.2em;color:rgba(255,255,255,.7);font-weight:700}
.hero h1{margin:8px 0 0;font-size:clamp(30px,6vw,56px);line-height:1.15;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:14px 0 0;color:rgba(255,255,255,.78);max-width:640px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.hero .chips span{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;font-size:13px;color:rgba(255,255,255,.85)}

/* 섹션 */
main.wrap{padding-top:48px;padding-bottom:24px}
section+section{margin-top:56px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-head h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 후보조 카드 */
.slates{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.slate{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
  transition:transform .25s ease,box-shadow .25s ease}
.slate:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(0,0,0,.35)}
.slate .top{background:var(--c);color:var(--ci);padding:18px 20px 16px;position:relative}
.slate .num{display:flex;align-items:baseline;gap:6px;font-weight:900;line-height:1}
.slate .num small{font-size:15px;letter-spacing:.1em}
.slate .num b{font-size:64px;letter-spacing:-.04em}
.slate .top{display:flex;flex-direction:column}
.slate .slogan{margin:14px 0 0;font-size:clamp(19px,2.2vw,23px);font-weight:900;line-height:1.3;letter-spacing:-.02em;text-wrap:balance;min-height:2.6em}
.slate .slogan::before{content:"“"}.slate .slogan::after{content:"”"}
.slate .top .lead{margin:8px 0 0;font-size:13px;font-weight:700;opacity:.8}
.slate .people{list-style:none;margin:0;padding:6px 20px 18px;display:grid}
.slate .people li{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.slate .people li:last-child{border-bottom:0}
.role{font-size:12px;font-weight:700;color:var(--muted);line-height:1.3}
.who{display:flex;flex-direction:column}
.who b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.who span{font-size:13px;color:var(--muted)}
.slate[data-n="1"]{--c:var(--c1);--ci:var(--c1-ink);--cs:var(--c1-soft);--ca:var(--c1)}
.slate[data-n="2"]{--c:var(--c2);--ci:var(--c2-ink);--cs:var(--c2-soft);--ca:var(--c2)}
.slate[data-n="3"]{--c:var(--c3);--ci:var(--c3-ink);--cs:var(--c3-soft);--ca:var(--c3-accent)}
.slate[data-n="4"]{--c:var(--c4);--ci:var(--c4-ink);--cs:var(--c4-soft);--ca:var(--c4)}
.slate[data-n="3"] .top{border-bottom:3px solid var(--c3-ink)}
/* 직책별 비교 */
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
thead th{font-size:14px}
thead th .tn{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;font-weight:900;margin-right:6px;background:var(--c);color:var(--ci)}
thead th[data-n="3"] .tn{box-shadow:inset 0 0 0 2px var(--c3-ink)}
tbody th{font-size:13px;color:var(--muted);white-space:nowrap;width:120px}
td b{display:block;font-size:17px}
.slogan-row td q{font-weight:800;font-size:15px;quotes:"“" "”"}
td span{font-size:13px;color:var(--muted)}
th[data-n="1"],td[data-n="1"]{--c:var(--c1);--ci:var(--c1-ink)}
th[data-n="2"],td[data-n="2"]{--c:var(--c2);--ci:var(--c2-ink)}
th[data-n="3"],td[data-n="3"]{--c:var(--c3);--ci:var(--c3-ink)}
th[data-n="4"],td[data-n="4"]{--c:var(--c4);--ci:var(--c4-ink)}
td[data-n]{box-shadow:inset 3px 0 0 var(--c)}

.note{margin:48px 0 0;padding:16px 18px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:13px;line-height:1.7}
footer.site{padding:24px 0 8px;color:var(--muted);font-size:13px}
footer.site a{color:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="bar">
      <a href="/">← MEIRO</a>
      <button class="theme" type="button" id="theme" aria-label="라이트/다크 모드 바꾸기" title="라이트/다크 모드 바꾸기">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <span class="kicker">SPECIAL PAGE · 비공식</span>
    <h1>2026 민주노총<br><em>직선 5기</em> 임원 선거</h1>
    <p>위원장 · 수석부위원장 · 사무총장 후보조 네 팀을 한눈에 봐요.</p>
    <div class="chips" id="hero-chips"></div>
  </div>
  <div class="stripes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
</header>

<main class="wrap">
  <section aria-labelledby="slates-title">
    <div class="sec-head">
      <div><h2 id="slates-title">후보조</h2><p>이름 아래는 출신 산별노조·연맹이에요.</p></div>
      <div class="tools" role="group" aria-label="보는 순서">
        <button class="tool" type="button" data-order="num" aria-pressed="true">기호 순</button>
        <button class="tool" type="button" data-order="shuffle" aria-pressed="false">무작위 순서</button>
      </div>
    </div>
    <div class="slates" id="slates"></div>
  </section>

  <section aria-labelledby="compare-title">
    <div class="sec-head"><div><h2 id="compare-title">직책별 비교</h2><p>같은 자리에 나선 후보를 나란히 봐요.</p></div></div>
    <div class="table-wrap"><table id="compare"></table></div>
  </section>

  <p class="note">이 페이지는 meiro.kr에서 만든 <b>비공식</b> 페이지로, 민주노총이나 선거관리위원회, 어느 후보조와도 관계가 없어요. 후보조 순서는 기호 순이고 특정 후보를 지지하지 않아요. 정확한 선거 일정과 공약은 공식 공고를 확인해 주세요.</p>
  <footer class="site"><a href="/">meiro.kr</a></footer>
</main>

<script>
// 후보조: 기호, 선본 슬로건, 위원장·수석부위원장·사무총장 (이름 옆은 출신 산별노조·연맹)
const ROLES = ["위원장", "수석부위원장", "사무총장"];
const SLATES = [
  { n: 1, slogan: "다시 뛴다! 민주노총", people: [["엄길용", "공공운수노조"], ["이승현", "사무금융노조"], ["박옥주", "전교조"]] },
  { n: 2, slogan: "돌파! 사회적 교섭", people: [["양경수", "금속노조"], ["정재범", "보건의료노조"], ["엄미경", "민주일반연맹"]] },
  { n: 3, slogan: "벽을 깨자", people: [["김민영", "전교조"], ["문화현", "민주일반연맹"], ["안지섭", "금속노조"]] },
  { n: 4, slogan: "민주노총 노선교체 출발합니다", people: [["최준식", "공공운수노조"], ["최희선", "보건의료노조"], ["황우찬", "금속노조"]] },
];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (s) => document.querySelector(s);

$("#hero-chips").innerHTML = `<span>후보조 ${SLATES.length}팀</span><span>후보 ${SLATES.length * 3}명</span>`;

let order = SLATES.map((s) => s.n);
function drawSlates() {
  $("#slates").innerHTML = order.map((n) => {
    const s = SLATES.find((x) => x.n === n);
    return `<article class="slate" data-n="${n}" aria-label="기호 ${n}번 후보조">
      <div class="top"><div class="num"><small>기호</small><b>${n}</b></div><p class="slogan">${esc(s.slogan)}</p><p class="lead">${esc(s.people[0][0])} 후보조</p></div>
      <ul class="people">${s.people.map(([name, u], i) => `<li>
        <span class="role">${ROLES[i]}</span>
        <span class="who"><b>${esc(name)}</b><span>${esc(u)}</span></span></li>`).join("")}</ul>
    </article>`;
  }).join("");
}
document.querySelectorAll("[data-order]").forEach((b) => b.onclick = () => {
  order = b.dataset.order === "shuffle"
    ? (() => { const a = SLATES.map((s) => s.n); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })()
    : SLATES.map((s) => s.n);
  document.querySelectorAll("[data-order]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  drawSlates();
});

// 직책별 비교 표
$("#compare").innerHTML = `<thead><tr><th scope="col">직책</th>${SLATES.map((s) => `<th scope="col" data-n="${s.n}"><span class="tn">${s.n}</span>기호 ${s.n}번</th>`).join("")}</tr></thead>
  <tbody><tr class="slogan-row"><th scope="row">선본 슬로건</th>${SLATES.map((s) => `<td data-n="${s.n}"><q>${esc(s.slogan)}</q></td>`).join("")}</tr>${ROLES.map((r, i) => `<tr><th scope="row">${r}</th>${SLATES.map((s) => `<td data-n="${s.n}"><b>${esc(s.people[i][0])}</b><span>${esc(s.people[i][1])}</span></td>`).join("")}</tr>`).join("")}</tbody>`;

drawSlates();

$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("meiro-theme", root.dataset.theme); } catch (e) {}
});
</script>
<script type="module" src="/feedback.js?v=1"></script>
</body>
</html>
