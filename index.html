<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>meiro.kr</title>
<meta name="description" content="meironomachi가 만든 사이트 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* Layout: bioscience 메인과 같은 틀. 상단 바로가기 바 + 초록 히어로 + 저장소 카드 목록(왼쪽 내용 | 오른쪽 버튼) + 최근 커밋 */
:root{
  --g900:#123d26; --g800:#14532d; --g700:#166534; --g600:#15803d; --g500:#22a05a;
  --g200:#bbe5c8; --g100:#dcf3e3; --g50:#f2faf4;
  --ink:#1c2420; --muted:#56635b; --line:#d6e2da; --bg:#fbfdfb; --card:#ffffff;
  --bar:rgba(255,255,255,.94); --on-accent:#ffffff;
  --hero-a:#14532d; --hero-b:#15803d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --g900:#d3f0dc; --g800:#b7e6c6; --g700:#8fd6a8; --g600:#2f9e5c; --g500:#4cc07b;
    --g200:#2c4a37; --g100:#1d3326; --g50:#17271e;
    --ink:#e3ebe5; --muted:#9aa89f; --line:#2a3a30; --bg:#101713; --card:#151f19;
    --bar:rgba(16,23,19,.94); --on-accent:#ffffff;
    --hero-a:#0f3d22; --hero-b:#16663a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --g900:#d3f0dc; --g800:#b7e6c6; --g700:#8fd6a8; --g600:#2f9e5c; --g500:#4cc07b;
  --g200:#2c4a37; --g100:#1d3326; --g50:#17271e;
  --ink:#e3ebe5; --muted:#9aa89f; --line:#2a3a30; --bg:#101713; --card:#151f19;
  --bar:rgba(16,23,19,.94); --on-accent:#ffffff;
  --hero-a:#0f3d22; --hero-b:#16663a; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);
  font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.72;word-break:keep-all;}
.gut{padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.wrap{max-width:920px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:60;background:var(--bar)}
.sitebar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;background:var(--bar);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);font-size:14px}
.sitebar .in{max-width:920px;margin:0 auto;padding-block:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sitebar .home{color:var(--g800);text-decoration:none;font-weight:800;white-space:nowrap}
.sitebar nav{display:flex;gap:4px;overflow-x:auto;min-width:0}
.sitebar nav a{color:var(--g700);text-decoration:none;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.sitebar nav a:hover{background:var(--g50)}
@media (max-width:680px){.sitebar nav{gap:0}.sitebar nav a{padding:2px 6px}}
header.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:56px 44px}
.hero .kicker{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
  padding:3px 12px;border-radius:999px;font-size:13px;letter-spacing:.04em}
.hero h1{font-size:34px;line-height:1.3;margin:14px 0 8px;font-weight:800;text-wrap:balance}
.hero p{margin:0;opacity:.9}
.hero .meta{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.hero .meta span{background:rgba(0,0,0,.18);padding:4px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .cta a{text-decoration:none;font-weight:700;border-radius:8px;padding:10px 20px;font-size:15px}
.hero .cta .solve{background:#fff;color:#14532d}
.hero .cta .solve:hover{background:#f2faf4}
.hero .cta .list{color:#fff;border:1px solid rgba(255,255,255,.5)}
.hero .cta .list:hover{background:rgba(255,255,255,.12)}

main.wrap{padding-bottom:80px}
.part{margin-top:44px}
.part-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--g600);padding-bottom:8px}
.part-head .no{background:var(--g600);color:var(--on-accent);font-weight:800;border-radius:8px;padding:4px 12px;font-size:14px;white-space:nowrap}
.part-head h2{margin:0;font-size:25px;color:var(--g900)}
.part-sub{color:var(--muted);font-size:14px;margin:6px 0 0}

.repos{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:14px}
.repos>li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:var(--card);
  border:1px solid var(--line);border-left:5px solid var(--g600);border-radius:10px;transition:border-color .15s,box-shadow .15s;
  scroll-margin-top:64px}
.repos>li:hover{border-color:var(--g500);box-shadow:0 4px 14px rgba(21,128,61,.12)}
.repos .acts{display:flex;flex-direction:column;gap:8px;padding:16px 20px 16px 0}
.repos .acts a{display:block;text-align:center;white-space:nowrap;text-decoration:none;font-weight:700;font-size:14.5px;
  border-radius:8px;padding:7px 16px;border:1px solid var(--g600)}
.repos .acts .read{color:var(--g700);background:var(--card);border-color:var(--g200)}
.repos .acts .read:hover{background:var(--g50)}
.repos .acts .solve{color:var(--on-accent);background:var(--g600)}
.repos .acts .solve:hover{background:var(--g700)}
.repos .acts .sub{color:var(--muted);background:none;border:0;padding:0;font-size:13px;font-weight:600;text-decoration:underline}
.repos .acts .sub:hover{color:var(--g700)}
a:focus-visible{outline:3px solid var(--g500);outline-offset:2px}
a.repo{display:grid;grid-template-columns:78px minmax(0,1fr);gap:18px;align-items:center;
  padding:16px 20px;color:var(--ink);text-decoration:none}
a.repo:focus-visible{outline-offset:-3px;border-radius:10px}
.repo .wk{text-align:center;background:var(--g50);border:1px solid var(--g200);border-radius:10px;padding:8px 0;line-height:1.15}
.repo .wk b{display:block;font-size:22px;color:var(--g700);font-weight:800}
.repo .wk small{font-size:12px;color:var(--muted)}
.repo h3{margin:0 0 2px;font-size:19px;color:var(--g800);line-height:1.4}
.repo h3 code{font-size:14px;font-weight:600;color:var(--muted);margin-left:6px}
.repo p{margin:0;font-size:14.5px;color:var(--muted)}
.repo .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.repo .chips span{background:var(--g50);border:1px solid var(--g200);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--g800)}
.repo .chips span.lock{background:none;border-style:dashed;color:var(--muted)}
@media (max-width:680px){
  .hero h1{font-size:27px}
  .repos>li{grid-template-columns:minmax(0,1fr)}
  a.repo{grid-template-columns:56px minmax(0,1fr);gap:14px;padding:14px 16px 10px}
  .repos .acts{flex-direction:row;flex-wrap:wrap;align-items:center;padding:0 16px 14px 86px}
  .repos .acts a{flex:1;padding:6px 10px}
  .repos .acts .sub{flex:0 0 auto}
  .repo .wk b{font-size:17px}
}
@media (max-width:420px){.repos .acts{padding-left:16px}}


</style>
</head>
<body>

<div class="sitebar gut"><div class="in">
  <a class="home" href="#top">내 저장소</a>
  <nav aria-label="저장소 바로가기" id="nav"></nav>
</div></div>

<header class="hero gut" id="top">
  <div class="wrap">
    <span class="kicker">meironomachi</span>
    <h1>내가 만든 프로젝트 모아보기</h1>
    <p>지금까지 만든 사이트를 한 곳에 모았습니다. 카드를 누르면 바로 열려요.</p>
    <div class="meta" id="meta"></div>
    <div class="cta">
      <a class="solve" href="#list">프로젝트 보기 →</a>
    </div>
  </div>
</header>

<main class="wrap gut">
  <section class="part" id="list">
    <div class="part-head"><span class="no">목록</span><h2>저장소</h2></div>
    <p class="part-sub">카드나 오른쪽 버튼을 누르면 사이트로 이동합니다.</p>
    <ul class="repos" id="repos"></ul>
  </section>


</main>

<script>
// 메인 페이지에 모을 때 항상 빼는 저장소 (사용자 요청)
const EXCLUDE = ["deadlinekeeper"];

const REPOS = [
  {
    name: "saytqtul",
    title: "일기장",
    private: true,
    lang: "TS", langName: "TypeScript",
    desc: "로그인해서 쓰는 달력형 일기장. 날짜를 눌러 글을 쓰고, 지난 글을 고치고 댓글도 달 수 있어요.",
    chips: ["달력에서 날짜 선택", "글 수정 · 댓글", "태그 관리", "Lovable · Supabase"],
    site: { label: "사이트 열기", href: "/saytqtul/" },
    sub: null
  },
  {
    name: "bioscience",
    title: "생명과학의 세계 교안 요약",
    private: false,
    lang: "HTML", langName: "HTML",
    desc: "2~8주차 교안을 정리한 사이트. 주차별 요약, 문제 풀기, A4 PDF를 한 곳에서 볼 수 있어요.",
    chips: ["주차별 요약 7개", "주차당 36~55문제", "A4 PDF"],
    site: { label: "사이트 열기", href: "/bioscience/" },
    sub: { label: "문제 풀기", href: "/bioscience/quiz/" }
  }
].filter(r => !EXCLUDE.includes(r.name));

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const gh = r => `https://github.com/meironomachi/${r.name}`;

document.getElementById("nav").innerHTML =
  REPOS.map(r => `<a href="#repo-${r.name}">${esc(r.title)}</a>`).join("");

const pub = REPOS.filter(r => !r.private).length;
document.getElementById("meta").innerHTML =
  `<span>저장소 ${REPOS.length}개</span><span>공개 ${pub} · 비공개 ${REPOS.length - pub}</span>`;

document.getElementById("repos").innerHTML = REPOS.map(r => `
  <li id="repo-${r.name}"><a class="repo" href="${r.site.href}">
    <div class="wk"><b>${r.lang}</b><small>${r.langName === r.lang ? "언어" : esc(r.langName)}</small></div>
    <div>
      <h3>${esc(r.title)}<code>${r.name}</code></h3>
      <p>${esc(r.desc)}</p>
      <div class="chips">${r.private ? `<span class="lock">비공개 저장소</span>` : ""}${r.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>
    </div>
  </a>
  <div class="acts">
    ${r.site ? `<a class="solve" href="${r.site.href}">${esc(r.site.label)}</a>` : ""}
    ${r.sub ? `<a class="read" href="${r.sub.href}">${esc(r.sub.label)}</a>` : ""}
  </div></li>`).join("");


</script>

</body>
</html>
