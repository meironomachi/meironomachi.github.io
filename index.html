<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEIROSPACE</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-96.png?v=2" type="image/png" sizes="96x96">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<meta name="description" content="meironomachi가 만든 사이트 모음">
<script>
  // 저장된 화면 테마(meiro.kr 전체 공통)를 먼저 적용해서 깜빡이지 않게 함
  try { const t = localStorage.getItem("meiro-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* Layout: bioscience 메인과 같은 틀. 상단 바로가기 바 + 초록 히어로 + 저장소 카드 목록(왼쪽 내용 | 오른쪽 버튼) + 최근 커밋 */
:root{
  --g900:#0b1f5c; --g800:#002a95; --g700:#0031b0; --g600:#0031b0; --g500:#3d63d6;
  --g200:#c9d5f6; --g100:#e3e9fb; --g50:#f1f4fd;
  --ink:#1d2230; --muted:#5b6478; --line:#dde2ee; --bg:#fbfcff; --card:#ffffff;
  --bar:rgba(255,255,255,.94); --on-accent:#ffffff;
  --hero-a:#00227a; --hero-b:#0031b0; --tile:#eef0f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --g900:#dbe4ff; --g800:#c3d0ff; --g700:#a9bbff; --g600:#3d5fd9; --g500:#8ea6ff;
    --g200:#2b3560; --g100:#1f2745; --g50:#1a2039;
    --ink:#e6e9f2; --muted:#a2a9bb; --line:#2c3350; --bg:#12141c; --card:#181c28;
    --bar:rgba(18,20,28,.94); --on-accent:#ffffff;
    --hero-a:#0a1a4d; --hero-b:#1b3aa0; --tile:#232838; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --g900:#dbe4ff; --g800:#c3d0ff; --g700:#a9bbff; --g600:#3d5fd9; --g500:#8ea6ff;
  --g200:#2b3560; --g100:#1f2745; --g50:#1a2039;
  --ink:#e6e9f2; --muted:#a2a9bb; --line:#2c3350; --bg:#12141c; --card:#181c28;
  --bar:rgba(18,20,28,.94); --on-accent:#ffffff;
  --hero-a:#0a1a4d; --hero-b:#1b3aa0; --tile:#232838; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);
  font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.72;word-break:keep-all;}
.gut{padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.wrap{max-width:920px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:60;background:var(--bar)}
.sitebar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;background:var(--bar);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);font-size:14px}
.sitebar .in{max-width:920px;margin:0 auto;padding-block:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sitebar .home{color:var(--g800);text-decoration:none;font-weight:800;white-space:nowrap}
.sitebar nav{display:flex;gap:4px;overflow-x:auto;min-width:0}
.sitebar nav a{color:var(--g700);text-decoration:none;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.sitebar nav a:hover{background:var(--g50)}
.sitebar nav a.emo{font-size:19px;line-height:1.4;padding:2px 7px}
.sitebar .right{display:flex;align-items:center;gap:6px;min-width:0}
.theme{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--g700);cursor:pointer;padding:0}
.theme:hover{background:var(--g50)}
.theme svg{width:16px;height:16px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon{display:none}}
button:focus-visible{outline:3px solid var(--g500);outline-offset:2px}
@media (max-width:680px){.sitebar nav{gap:0}.sitebar nav a{padding:2px 6px}}
header.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:56px 44px}
.hero .kicker{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
  padding:3px 12px;border-radius:999px;font-size:13px;letter-spacing:.04em}
.hero h1{font-size:34px;line-height:1.3;margin:0 0 8px;font-weight:800;text-wrap:balance}
.hero p{margin:0;opacity:.9}
.hero .meta{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.hero .meta span{background:rgba(0,0,0,.18);padding:4px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .cta a{text-decoration:none;font-weight:700;border-radius:8px;padding:10px 20px;font-size:15px}
.hero .cta .solve{background:#fff;color:#0031b0}
.hero .cta .solve:hover{background:#f1f4fd}
.hero .cta .list{color:#fff;border:1px solid rgba(255,255,255,.5)}
.hero .cta .list:hover{background:rgba(255,255,255,.12)}

main.wrap{padding-bottom:80px}
.part{margin-top:44px}
.part-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--g600);padding-bottom:8px}
.part-head h2{letter-spacing:.04em}
.part-head .no{background:var(--g600);color:var(--on-accent);font-weight:800;border-radius:8px;padding:4px 12px;font-size:14px;white-space:nowrap}
.part-head h2{margin:0;font-size:25px;color:var(--g900)}
.part-sub{color:var(--muted);font-size:14px;margin:6px 0 0}

.repos{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.repos>li{aspect-ratio:1/1;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-top:5px solid var(--g600);border-radius:12px;transition:border-color .15s,box-shadow .15s;
  scroll-margin-top:64px;min-width:0}
.repos>li:hover{border-color:var(--g500);box-shadow:0 4px 14px rgba(0,49,176,.14)}
a.repo{flex:1;display:flex;flex-direction:column;gap:8px;padding:22px 22px 12px;color:var(--ink);text-decoration:none;min-width:0}
a:focus-visible{outline:3px solid var(--g500);outline-offset:2px}
a.repo:focus-visible{outline-offset:-3px;border-radius:10px}
.repo h3{margin:0;font-size:21px;color:var(--g800);line-height:1.35;text-wrap:balance}
.repo p{margin:0;font-size:14.5px;color:var(--muted)}
.repo .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.repo .chips span{background:var(--g50);border:1px solid var(--g200);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--g800)}
.repos .acts{display:flex;gap:8px;padding:0 22px 22px}
.repos .acts a{flex:1;text-align:center;white-space:nowrap;text-decoration:none;font-weight:700;font-size:14.5px;
  border-radius:8px;padding:8px 12px;border:1px solid var(--g600)}
.repos .acts .read{color:var(--g700);background:var(--card);border-color:var(--g200)}
.repos .acts .read:hover{background:var(--g50)}
.repos .acts .solve{color:var(--on-accent);background:var(--g600)}
.repos .acts .solve:hover{background:var(--g700)}
@media (max-width:680px){.hero h1{font-size:27px}}
/* 한국 표준시 시계: 날짜는 작게, 시·분·초는 숫자마다 연한 회색 칸, 바뀔 때 페이드 */
.kst{margin-top:44px;text-align:center}
.kst .date{margin:0;font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.kst .digits{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:10px}
.kst .dg{position:relative;width:clamp(40px,11vw,68px);height:clamp(56px,15vw,92px);border-radius:10px;background:var(--tile);overflow:hidden;
  font-size:clamp(34px,10vw,60px);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.kst .dg span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}
.kst .dg span.out{opacity:0}
.kst .dg span.in{opacity:0}
.kst .colon{font-size:clamp(28px,8vw,48px);font-weight:700;color:var(--muted);padding:0 2px;line-height:1}
.kst .pair{display:flex;gap:6px}
.kst .src{margin:10px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
@media (max-width:400px){.kst .digits,.kst .pair{gap:4px}}
@media (prefers-reduced-motion: reduce){.kst .dg span{transition:none}}
</style>
</head>
<body>

<div class="sitebar gut"><div class="in">
  <a class="home" href="#top">MEIRO</a>
  <div class="right">
    <nav aria-label="사이트 바로가기" id="nav"></nav>
    <button class="theme" type="button" id="theme" aria-label="라이트/다크 모드 바꾸기" title="라이트/다크 모드 바꾸기">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</div></div>

<header class="hero gut" id="top">
  <div class="wrap">
    <h1>MEIROSPACE</h1>
    <p>내게 필요해서 하나씩 만든 것들을 모아 두는 곳.</p>
    <div class="meta" id="meta"></div>
    <div class="cta">
      <a class="solve" href="#list">LISTS 보기 →</a>
    </div>
  </div>
</header>

<main class="wrap gut">
  <section class="kst" aria-label="한국 표준시">
    <p class="date" id="kst-date"></p>
    <div class="digits" id="kst-digits" role="timer" aria-live="off"></div>
    <p class="src">한국 표준시 (KST)</p>
  </section>

  <section class="part" id="list">
    <div class="part-head"><h2>LISTS</h2></div>
    <p class="part-sub">카드를 누르면 사이트로 이동합니다.</p>
    <ul class="repos" id="repos"></ul>
  </section>

</main>

<script>
// 메인 페이지에 모을 때 항상 빼는 저장소 (사용자 요청)
const EXCLUDE = ["deadlinekeeper"];

const REPOS = [
  {
    name: "saytqtul",
    emoji: "📝",
    title: "일기장",
    desc: "로그인해서 쓰는 달력형 일기장. 날짜를 눌러 글을 쓰고, 지난 글을 고치고 댓글도 달 수 있어요.",
    chips: ["달력에서 날짜 선택", "글 수정 · 댓글", "태그 관리"],
    site: { label: "사이트 열기", href: "/saytqtul/" },
    sub: null
  },
  {
    name: "library",
    emoji: "📚",
    title: "MEIROBOOK",
    desc: "다 읽은 책을 천천히 정리하고, 감상과 밑줄을 남겨 두는 서재.",
    chips: ["표지 검색", "밀리의 서재 밑줄", "감상 질문 3가지"],
    site: { label: "사이트 열기", href: "/library/" },
    sub: null
  },
  {
    name: "money",
    emoji: "💵",
    title: "$TDL",
    desc: "수입과 지출, 예산을 한눈에 보는 가계부. 은행 거래내역 파일도 한 번에 가져와요.",
    chips: ["이번 달 요약", "예산", "카카오뱅크 파일 가져오기"],
    site: { label: "사이트 열기", href: "/money/" },
    sub: null
  },
  {
    name: "note",
    emoji: "✍🏻",
    title: "MEIRONOTE",
    desc: "일기장 모양 그대로 글을 백업해 두는 곳. 폴더로 나누고, 자동 저장과 버전 기록으로 지난 글도 지켜요.",
    chips: ["폴더", "자동 저장 · 버전 기록", "월간 글자 수"],
    site: { label: "사이트 열기", href: "/note/" },
    sub: null
  },
  {
    name: "pay",
    emoji: "💰",
    title: "MEIROPAY",
    desc: "큰 달력에 근무 시간을 적으면 이번 달 월급을 세전·세후로 계산해 줘요. 지난달과도 비교해요.",
    chips: ["3.3% · 4대보험 · 세금 없음", "주휴·야간·연장수당", "전월 대비"],
    site: { label: "사이트 열기", href: "/pay/" },
    sub: null
  },
  {
    name: "kctu2026",
    emoji: "🗳️",
    title: "2026 민주노총 직선 5기 선거",
    desc: "후보조 네 팀의 표어와 대표 공약, 공약 묶음을 한 장씩 펼쳐 보는 비공식 선거 특보.",
    chips: ["후보조 4팀", "대표 공약", "토론회 발언 비교"],
    site: { label: "사이트 열기", href: "/kctu2026/" },
    sub: null
  },
  {
    name: "bioscience",
    emoji: "🔬",
    title: "생명과학의 세계 교안 요약",
    desc: "2~8주차 교안을 정리한 사이트. 주차별 요약, 문제 풀기, A4 PDF를 한 곳에서 볼 수 있어요.",
    chips: ["주차별 요약 7개", "주차당 36~55문제", "A4 PDF"],
    site: { label: "사이트 열기", href: "/bioscience/" },
    sub: { label: "문제 풀기", href: "/bioscience/quiz/" }
  }
].filter(r => !EXCLUDE.includes(r.name));

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("meiro-theme", root.dataset.theme); } catch (e) {}
});

document.getElementById("nav").innerHTML =
  REPOS.map(r => `<a class="emo" href="#repo-${r.name}" title="${esc(r.title)}" aria-label="${esc(r.title)}">${r.emoji}</a>`).join("");

document.getElementById("meta").innerHTML = `<span>사이트 ${REPOS.length}개</span>`;

document.getElementById("repos").innerHTML = REPOS.map(r => `
  <li id="repo-${r.name}"><a class="repo" href="${r.site.href}">
    <h3>${esc(r.title)}</h3>
    <p>${esc(r.desc)}</p>
    <div class="chips">${r.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>
  </a>
  <div class="acts">
    ${r.site ? `<a class="solve" href="${r.site.href}">${esc(r.site.label)}</a>` : ""}
    ${r.sub ? `<a class="read" href="${r.sub.href}">${esc(r.sub.label)}</a>` : ""}
  </div></li>`).join("");

// 한국 표준시 시계 (기기 시계 기준). 숫자가 바뀌는 칸만 페이드로 바꿈
(() => {
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const box = document.getElementById("kst-digits"), dateEl = document.getElementById("kst-date");
  box.innerHTML = [0, 1, 2].map((i) => `${i ? '<span class="colon" aria-hidden="true">:</span>' : ""}<span class="pair">${'<span class="dg"><span></span></span>'.repeat(2)}</span>`).join("");
  const cells = [...box.querySelectorAll(".dg")];
  const p = (n) => String(n).padStart(2, "0");
  const set = (cell, ch) => {
    const cur = cell.lastElementChild;
    if (cur.textContent === ch) return;
    if (!cur.textContent) { cur.textContent = ch; return; }
    const next = document.createElement("span");
    next.className = "in"; next.textContent = ch;
    cell.append(next);
    requestAnimationFrame(() => requestAnimationFrame(() => { next.className = ""; cur.className = "out"; }));
    setTimeout(() => cur.remove(), 500);
  };
  const tick = () => {
    const t = new Date(Date.now() + 9 * 3600 * 1000);
    dateEl.textContent = `${t.getUTCFullYear()}년 ${t.getUTCMonth() + 1}월 ${t.getUTCDate()}일 ${DOW[t.getUTCDay()]}요일`;
    const hms = p(t.getUTCHours()) + p(t.getUTCMinutes()) + p(t.getUTCSeconds());
    [...hms].forEach((ch, i) => set(cells[i], ch));
    box.setAttribute("aria-label", `${hms.slice(0, 2)}시 ${hms.slice(2, 4)}분 ${hms.slice(4)}초`);
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5); // 초가 바뀌는 순간에 맞춤
  };
  tick();
})();
</script>

<script type="module" src="/feedback.js?v=1"></script>
</body>
</html>
